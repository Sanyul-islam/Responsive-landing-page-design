
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three Landing Pages</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            overflow-x: hidden;
        }

        iframe {
            display: block;
            width: 100%;
            border: none;
            min-height: 100vh;
        }

        .landing-page {
            width: 100%;
        }
    </style>
</head>
<body>

    <main>
        <!-- Landing Page 1 -->
        <section class="landing-page">
            <iframe
                src="./page1/index.html"
                title="Landing Page 1">
            </iframe>
        </section>

        <!-- Landing Page 2 -->
        <section class="landing-page">
            <iframe
                src="./page2/index.html"
                title="Landing Page 2">
            </iframe>
        </section>

        <!-- Landing Page 3 -->
        <section class="landing-page">
            <iframe
                src="./page3/index.html"
                title="Landing Page 3">
            </iframe>
        </section>
    </main>

</body>
</html>
